<svg viewBox="0 0 900 300" xmlns="http://www.w3.org/2000/svg" font-family="Noto Sans TC, sans-serif">
<rect width="900" height="300" fill="#0F3B2E"/>
<defs>
  <marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#C9A961"/></marker>
  <marker id="ah-rev" markerWidth="9" markerHeight="9" refX="2" refY="4.5" orient="auto"><path d="M9 0 L0 4.5 L9 9 z" fill="#88CCAA"/></marker>
</defs>
<!-- 標題 -->
<text x="30" y="38" fill="#C9A961" font-size="20" font-weight="700">HPG 軸｜FSH/LH 通路 → 卵泡發育支持</text>
<!-- 左：HPG 三層橢圓 cascade -->
<!-- 下丘腦 -->
<ellipse cx="110" cy="100" rx="70" ry="28" fill="#1a5040" stroke="#C9A961" stroke-width="2"/>
<text x="110" y="96" fill="#fff" font-size="14" font-weight="700" text-anchor="middle">下丘腦</text>
<text x="110" y="113" fill="#C9A961" font-size="11" text-anchor="middle">Hypothalamus</text>
<!-- GnRH 箭頭 -->
<line x1="110" y1="129" x2="110" y2="158" stroke="#C9A961" stroke-width="2.5" marker-end="url(#ah)"/>
<text x="118" y="148" fill="#F5EFE0" font-size="12">GnRH</text>
<!-- 垂體 -->
<ellipse cx="110" cy="185" rx="70" ry="28" fill="#1a5040" stroke="#C9A961" stroke-width="2"/>
<text x="110" y="181" fill="#fff" font-size="14" font-weight="700" text-anchor="middle">垂體</text>
<text x="110" y="198" fill="#C9A961" font-size="11" text-anchor="middle">Pituitary</text>
<!-- FSH/LH 分叉箭頭 -->
<line x1="110" y1="214" x2="110" y2="243" stroke="#C9A961" stroke-width="2.5" marker-end="url(#ah)"/>
<text x="118" y="233" fill="#F5EFE0" font-size="12">FSH / LH</text>
<!-- 卵巢 -->
<ellipse cx="110" cy="268" rx="70" ry="26" fill="#244" stroke="#C9A961" stroke-width="2"/>
<text x="110" y="264" fill="#fff" font-size="14" font-weight="700" text-anchor="middle">卵巢</text>
<text x="110" y="281" fill="#C9A961" font-size="11" text-anchor="middle">Ovary</text>
<!-- Estrogen 負回饋弧 -->
<path d="M 180 268 C 230 268 230 100 180 100" fill="none" stroke="#88CCAA" stroke-width="1.8" stroke-dasharray="6,3" marker-end="url(#ah-rev)"/>
<text x="218" y="175" fill="#88CCAA" font-size="11" text-anchor="middle">Estrogen</text>
<text x="218" y="188" fill="#88CCAA" font-size="10" text-anchor="middle">負回饋</text>
<!-- 右：卵泡池效果面板 -->
<rect x="310" y="68" width="560" height="210" rx="10" fill="rgba(255,255,255,0.06)" stroke="#C9A961" stroke-width="1"/>
<text x="590" y="92" fill="#C9A961" font-size="15" font-weight="700" text-anchor="middle">植物甾醇介入效果</text>
<!-- FSH 效果 -->
<rect x="330" y="105" width="240" height="78" rx="6" fill="#1a5040"/>
<text x="450" y="126" fill="#fff" font-size="13" font-weight="700" text-anchor="middle">FSH ↑ 卵泡招募</text>
<text x="450" y="145" fill="#F5EFE0" font-size="12" text-anchor="middle">初級卵泡 → 次級卵泡</text>
<text x="450" y="163" fill="#C9A961" font-size="12" text-anchor="middle">轉化率 +15–20%〔推估〕</text>
<!-- LH 效果 -->
<rect x="590" y="105" width="260" height="78" rx="6" fill="#1a5040"/>
<text x="720" y="126" fill="#fff" font-size="13" font-weight="700" text-anchor="middle">LH ↑ 排卵觸發</text>
<text x="720" y="145" fill="#F5EFE0" font-size="12" text-anchor="middle">成熟卵泡 → 排卵峰</text>
<text x="720" y="163" fill="#C9A961" font-size="12" text-anchor="middle">產蛋/繁殖高峰延長</text>
<!-- 卵泡閉鎖率主數字 -->
<rect x="330" y="200" width="520" height="60" rx="6" fill="#244"/>
<text x="590" y="222" fill="#C9A961" font-size="24" font-weight="700" text-anchor="middle">卵泡閉鎖率 ↓ 15–20%</text>
<text x="590" y="247" fill="#F5EFE0" font-size="12" text-anchor="middle">有效卵泡池擴大 · 種蛋孵化率 +5–8%〔推估，源自植物甾醇文獻〕</text>
</svg>
